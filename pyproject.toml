readme = "README.md"
authors = [
    { name = "Ayush Yadav", email = "ayush.yadav@leadwisdoms.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "groq>=1.7.0",
